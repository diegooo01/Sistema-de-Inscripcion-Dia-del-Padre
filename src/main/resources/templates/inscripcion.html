<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Inscripción - Día del Padre</title>
</head>
<body>
<h1>Inscripción al evento "Día del Padre"</h1>

<form action="/inscripcion" method="post" enctype="multipart/form-data">
  <p>
    <label>DNI del colegiado:</label>
    <input type="text" name="dni" required maxlength="8">
  </p>
  <p>
    <label>Nombre:</label>
    <input type="text" name="nombre" required>
  </p>
  <p>
    <label>Imagen del DNI del menor:</label>
    <input type="file" name="imagen" accept="image/*" required>
  </p>
  <button type="submit">Enviar inscripción</button>
</form>
</body>
</html>
