<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Administración</title>
</head>
<body>
<h1>Dashboard de Control</h1>

<p th:if="${mensaje}" th:text="${mensaje}" style="color: green;"></p>
<p th:if="${error}" th:text="${error}" style="color: red;"></p>

<h2>Métricas</h2>
<ul>
    <li>Total de solicitudes: <span th:text="${total}">0</span></li>
    <li>Aprobados: <span th:text="${aprobados}">0</span></li>
    <li>Rechazados: <span th:text="${rechazados}">0</span></li>
    <li>Pendientes: <span th:text="${pendientes}">0</span></li>
</ul>

<h2>Solicitudes pendientes</h2>
<table border="1" cellpadding="6">
    <thead>
    <tr>
        <th>ID</th>
        <th>DNI</th>
        <th>Nombre</th>
        <th>Imagen DNI menor</th>
        <th>Fecha de registro</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="i : ${inscripcionesPendientes}">
        <td th:text="${i.id}"></td>
        <td th:text="${i.dni}"></td>
        <td th:text="${i.nombre}"></td>
        <td th:text="${i.imagenDniMenor}"></td>
        <td th:text="${i.fechaRegistro}"></td>
        <td>
            <form th:action="@{/dashboard/aprobar/{id}(id=${i.id})}" method="post">
                <button type="submit">Aprobar</button>
            </form>
            <form th:action="@{/dashboard/rechazar/{id}(id=${i.id})}" method="post">
                <input type="text" name="observacion" placeholder="Motivo del rechazo" required>
                <button type="submit">Rechazar</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
