server:
  port: 8080

spring:
  application:
    name: inscripciones
  datasource:
    url: jdbc:postgresql://localhost:5433/inscripciones
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  app:
    uploads-dir: uploads
colegiados:
  api:
    base-url: http://localhost:3000