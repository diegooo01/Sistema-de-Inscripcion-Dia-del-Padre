services:
  db:
    image: postgres:16-alpine
    container_name: inscripciones-db
    environment:
      POSTGRES_DB: inscripciones
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inscripciones"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-colegiados:
    build: ./mock-colegiados
    container_name: inscripciones-mock
    ports:
      - "3000:3000"
  app:
    build: .
    container_name: inscripciones-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      db:
        condition: service_healthy
      mock-colegiados:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads
volumes:
  postgres_data: